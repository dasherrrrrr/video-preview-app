services:
  video-preview:
    build: .
    container_name: video-preview
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Datenbank - MUSS gemountet sein, sonst sind User/Marker beim Update weg
      - ./data:/app/data
      # Deine Videodateien, read-only eingebunden (die App muss dort nichts schreiben)
      - "${VIDEOS_HOST_PATH:-/mnt/user/videos}:/videos:ro"
    environment:
      # Fester Secret-Key, damit Logins nicht bei jedem Container-Neustart
      # ungültig werden. Wird aus .env gelesen (siehe .env.example) - ohne
      # gesetzten Wert fällt main.py auf einen Zufalls-Key pro Neustart zurück.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - VIDEOS_DIR=/videos
      - PYTHONUNBUFFERED=1
      - VAAPI_DEVICE=${VAAPI_DEVICE:-/dev/dri/renderD128}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - APP_BASE_URL=${APP_BASE_URL:-}
    restart: unless-stopped

    # VAAPI-Transcoding über eine Intel-GPU (z.B. Arc A380). Pfad über
    # VAAPI_DEVICE in .env anpassen, falls die Karte an einem anderen
    # /dev/dri/renderDXXX-Node hängt (mehrere GPUs im System möglich).
    devices:
      - "${VAAPI_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128"
