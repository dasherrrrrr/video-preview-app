services:
  video-preview:
    build: .
    container_name: video-preview
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # Datenbank - MUSS gemountet sein, sonst sind User/Marker beim Update weg
      - ./data:/app/data
      # Deine Videodateien, read-only eingebunden (die App muss dort nichts schreiben)
      - "${VIDEOS_HOST_PATH:-/mnt/user/videos}:/videos:ro"
    environment:
      # Fester Secret-Key, damit Logins nicht bei jedem Container-Neustart
      # ungültig werden. Wird aus .env gelesen (siehe .env.example) - ohne
      # gesetzten Wert fällt main.py auf einen Zufalls-Key pro Neustart zurück.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - VIDEOS_DIR=/videos
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

    # Wird erst ab Teil 2 gebraucht (VAAPI-Transcoding über die Arc A380).
    # Schon vorbereitet, damit wir es dann nur noch einkommentieren müssen -
    # entspricht dem, was wir im VAAPI-Test schon erfolgreich durchgetestet haben.
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
